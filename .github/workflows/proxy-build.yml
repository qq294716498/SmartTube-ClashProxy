name: Build SmartTube Proxy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Fetch verified Mihomo AAR
        run: bash scripts/fetch-libmihomo.sh

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Lint proxy flavor
        run: ./gradlew lintStproxyDebug

      - name: Build proxy flavor
        run: ./gradlew clean assembleStproxyDebug

      - name: Generate checksums
        run: sha256sum smarttubetv/build/outputs/apk/stproxy/debug/*.apk > smarttubetv/build/outputs/apk/stproxy/debug/SHA256SUMS.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Proxy-arm64
          path: smarttubetv/build/outputs/apk/stproxy/debug/*_arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Proxy-armeabi-v7a
          path: smarttubetv/build/outputs/apk/stproxy/debug/*_armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload universal APK and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Proxy-universal
          path: |
            smarttubetv/build/outputs/apk/stproxy/debug/*_universal.apk
            smarttubetv/build/outputs/apk/stproxy/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
