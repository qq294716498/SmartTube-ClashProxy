name: Build SmartTube Proxy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Fetch verified Mihomo AAR
        run: bash scripts/fetch-libmihomo.sh

      - name: Restore persistent APK signing key
        if: github.event_name != 'pull_request'
        env:
          PROXY_KEYSTORE_B64: ${{ secrets.SMARTTUBE_PROXY_KEYSTORE_B64 }}
        run: |
          if [ -z "$PROXY_KEYSTORE_B64" ]; then
            echo '::error::Set the SMARTTUBE_PROXY_KEYSTORE_B64 repository secret before building updateable APKs.'
            exit 1
          fi
          printf '%s' "$PROXY_KEYSTORE_B64" | base64 --decode > smarttubetv/proxy-signing.p12
          chmod 600 smarttubetv/proxy-signing.p12
          cat > keystore.properties <<'EOF'
          storeFile=proxy-signing.p12
          storePassword=android
          keyAlias=smarttubeproxy
          keyPassword=android
          EOF
          keytool -list -keystore smarttubetv/proxy-signing.p12 -storepass android -alias smarttubeproxy > /dev/null

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Lint proxy flavor
        run: ./gradlew lintStproxyDebug

      - name: Test embedded proxy safety policy
        run: ./gradlew :smarttubetv:testStproxyDebugUnitTest --tests 'com.liskovsoft.smartyoutubetv2.tv.proxy.*'

      - name: Build proxy flavor
        run: ./gradlew clean assembleStproxyDebug

      - name: Generate checksums
        if: github.event_name != 'pull_request'
        working-directory: smarttubetv/build/outputs/apk/stproxy/debug
        run: |
          sha256sum *_arm64-v8a.apk > SHA256SUMS-arm64.txt
          sha256sum *_armeabi-v7a.apk > SHA256SUMS-armeabi-v7a.txt
          sha256sum *_universal.apk > SHA256SUMS-universal.txt

      - name: Upload ARM64 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Proxy-arm64
          path: |
            smarttubetv/build/outputs/apk/stproxy/debug/*_arm64-v8a.apk
            smarttubetv/build/outputs/apk/stproxy/debug/SHA256SUMS-arm64.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARMv7 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Proxy-armeabi-v7a
          path: |
            smarttubetv/build/outputs/apk/stproxy/debug/*_armeabi-v7a.apk
            smarttubetv/build/outputs/apk/stproxy/debug/SHA256SUMS-armeabi-v7a.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload universal APK and checksums
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube-Proxy-universal
          path: |
            smarttubetv/build/outputs/apk/stproxy/debug/*_universal.apk
            smarttubetv/build/outputs/apk/stproxy/debug/SHA256SUMS-universal.txt
          if-no-files-found: error
          retention-days: 7
