<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Clash 代理中心界面示意（非实机截图）</title>
  <desc id="desc">依据源码的深蓝双栏布局绘制。左侧代理状态及菜单，右侧测速按钮和示例节点。所有节点名及延迟为演示数据。</desc>
  <rect width="1280" height="720" fill="#0a111e"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#eaf1fb">
    <text x="36" y="58" font-size="30" font-weight="700">Clash 代理中心</text>
    <rect x="1090" y="24" width="150" height="46" rx="8" fill="#162234"/>
    <text x="1165" y="54" text-anchor="middle" font-size="18">返回视频</text>
    <text x="36" y="94" font-size="17" fill="#a0b2c8">演示订阅 / 示例节点 A</text>
    <text x="48" y="157" font-size="23" fill="#4adaa9">● 代理已开启</text>
    <g fill="#162234">
      <rect x="36" y="180" width="220" height="54" rx="8"/>
      <rect x="36" y="248" width="220" height="54" rx="8" stroke="#4698ff" stroke-width="2"/>
      <rect x="36" y="316" width="220" height="54" rx="8"/>
      <rect x="36" y="384" width="220" height="54" rx="8"/>
      <rect x="36" y="452" width="220" height="54" rx="8"/>
    </g>
    <g font-size="21">
      <text x="59" y="215">关闭代理</text><text x="59" y="283">连接与节点</text>
      <text x="59" y="351">订阅管理</text><text x="59" y="419">检测与日志</text>
      <text x="59" y="487">手机扫码管理</text>
    </g>
    <g font-size="17" fill="#a0b2c8"><text x="49" y="550">方向键移动</text><text x="49" y="577">确定键操作</text><text x="49" y="604">返回键回到视频</text></g>
    <text x="294" y="146" font-size="25">节点选择</text>
    <text x="294" y="179" font-size="16" fill="#a0b2c8">确定键切换节点 · 绿色勾选为实际使用节点 · 延迟不是下载速度</text>
    <g fill="#162234"><rect x="294" y="199" width="220" height="47" rx="7"/><rect x="528" y="199" width="220" height="47" rx="7"/><rect x="762" y="199" width="160" height="47" rx="7"/><rect x="294" y="259" width="220" height="47" rx="7"/><rect x="528" y="259" width="220" height="47" rx="7"/><rect x="762" y="259" width="220" height="47" rx="7"/></g>
    <g font-size="19"><text x="324" y="229">全部测延迟</text><text x="558" y="229">测选中节点</text><text x="815" y="229">停止</text><text x="324" y="290">按延迟排序</text><text x="558" y="290">刷新节点</text><text x="791" y="290">检测 YouTube</text></g>
    <rect x="294" y="330" width="946" height="84" rx="8" fill="#162234" stroke="#4adaa9" stroke-width="1.5"/>
    <text x="315" y="365" font-size="23" fill="#4adaa9">✓ 示例节点 A</text><text x="350" y="395" font-size="17" fill="#4adaa9">使用中 · Shadowsocks · 86 ms</text>
    <rect x="294" y="429" width="946" height="84" rx="8" fill="#162234"/>
    <text x="350" y="464" font-size="23">示例节点 B</text><text x="350" y="494" font-size="17" fill="#a0b2c8">Trojan · 128 ms</text>
    <rect x="294" y="528" width="946" height="84" rx="8" fill="#162234"/>
    <text x="350" y="563" font-size="23">自动选择（示例）</text><text x="350" y="593" font-size="17" fill="#a0b2c8">URLTest · 未测速</text>
    <text x="36" y="660" font-size="17" fill="#a0b2c8">仅代理本软件，不影响电视上的其他应用。</text>
    <text x="1240" y="696" font-size="16" text-anchor="end" fill="#a0b2c8">界面示意 · 非实机截图 · 节点及延迟均为演示数据</text>
  </g>
</svg>
